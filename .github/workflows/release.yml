name: Release

# Runs when you push a tag that starts with "v", e.g. v1.0.0
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
            asset: BourseRadar-Windows.exe
          - os: ubuntu-22.04
            sep: ":"
            asset: BourseRadar-Linux
          - os: macos-latest
            sep: ":"
            asset: BourseRadar-macOS.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download Persian font (Vazirmatn, open license)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Vazirmatn-Regular.ttf \
            https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Regular.ttf

      - name: Build app
        run: |
          pyinstaller --noconfirm --onefile --windowed --name BourseRadar \
            --add-data "fonts${{ matrix.sep }}fonts" \
            --collect-data tzdata \
            gui.py

      - name: Package
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv BourseRadar.exe "${{ matrix.asset }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            ditto -c -k --keepParent BourseRadar.app "${{ matrix.asset }}"
          else
            mv BourseRadar "${{ matrix.asset }}"
            chmod +x "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
