name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0,<7"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build exe
        run: pyinstaller --onefile --windowed --noconfirm --name BourseRadar --collect-data tzdata app_gui.py

      - name: Verify exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/BourseRadar.exe)) {
            Write-Error "dist/BourseRadar.exe was not created"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist/BourseRadar.exe release/
          Compress-Archive -Path release/* -DestinationPath BourseRadar-windows.zip

      - name: Upload build for manual testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: BourseRadar-windows
          path: BourseRadar-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BourseRadar-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}